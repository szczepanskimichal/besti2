# bestiapp.no: everything runs on one server. Copied to /opt/besti by the deploy job (.github/workflows/ci.yml).
# Secrets are in /opt/besti/.env on the server only (see deploy/.env.prod.example).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # The only container open to the internet: HTTPS with the Cloudflare origin certificate
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
    depends_on:
      - web
      - api
    networks: [besti]
    logging: *logging

  web:
    image: ghcr.io/szczepanskimichal/besti2-web:${TAG:-latest}
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
    depends_on:
      - api
    networks: [besti]
    logging: *logging

  api:
    image: ghcr.io/szczepanskimichal/besti2-api:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__MigrateOnStartup: "true"
      Database__RemoveDemoData: "true"
      DataProtection__KeysPath: /keys
      ForwardedHeaders__KnownNetwork: 172.30.0.0/24
      WebBaseUrl: https://bestiapp.no
      ImageStorage__PublicBaseUrl: https://bestiapp.no/uploads
    volumes:
      - uploads:/app/uploads
      - keys:/keys
    depends_on:
      sqlserver:
        condition: service_healthy
    networks: [besti]
    logging: *logging
    
    # No port to the internet. Express edition: free for production use (max 10 GB per database)  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    # Only on the server itself (127.0.0.1): reachable from Rider through an SSH tunnel
    ports:
      - "127.0.0.1:1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - sqldata:/var/opt/mssql
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [besti]
    logging: *logging

networks:
  besti:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  sqldata:
  uploads:
  keys:
  caddy_data:
