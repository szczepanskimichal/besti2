<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 18 106 112" width="212" height="224">
  <defs>
    <linearGradient id="gOuter" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#3dff7a"/><stop offset="0.6" stop-color="#1fd9a0"/><stop offset="1" stop-color="#1a9fc0"/>
    </linearGradient>
    <linearGradient id="gInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2af5e0"/><stop offset="0.5" stop-color="#2be89a"/><stop offset="1" stop-color="#1ba7c9"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- inner pin, its right side is the spine of the B -->
    <path d="M48 112 L28 78 A23 23 0 1 1 68 78 Z" stroke="url(#gInner)" stroke-width="6"/>
    <!-- B bowls -->
    <path d="M48 36 H82 A16 16 0 0 1 82 68 H68" stroke="url(#gInner)" stroke-width="6"/>
    <path d="M68 68 H86 A20 20 0 0 1 86 108 H56" stroke="url(#gInner)" stroke-width="6"/>
    <circle cx="48" cy="59" r="8" fill="#3ff2ff" stroke="none"/>
  </g>
</svg>
